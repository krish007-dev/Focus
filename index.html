<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Playlist | Deep Work & Focus</title>
    
    <!-- FAVICON (Website Logo) -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- SEO Tags -->
    <meta name="description" content="A curated, cinematic workspace soundtrack for deep work and focus. Free custom YouTube player with lofi and ambient music.">
    <meta name="keywords" content="office playlist, deep work music, focus soundtrack, cinematic workspace, productivity music">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-overlay"></div>

    <header class="top-bar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-mug-hot"></i></div>
            <div class="logo-text">
                <h2>Office Playlist</h2>
                <p>DEEP WORK & FOCUS</p>
            </div>
        </div>
    </header>

    <main class="center-content">
        <h1 class="main-title">Focus.</h1>
        <p class="subtitle">Your curated workspace soundtrack</p>
    </main>

    <!-- NEW: Redesigned Center Queue Modal -->
    <div id="queue-modal" class="queue-modal hidden">
        <div class="queue-header">
            <h3>Queue</h3>
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="queue-search" placeholder="Search songs..." onkeyup="filterQueue()">
            </div>
            <button onclick="toggleQueue()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul id="queue-list"></ul>
    </div>

    <!-- Hidden YouTube Player -->
    <div id="player" class="hidden-player"></div>

    <footer class="player-container">
        <div class="player-bar">
            <div class="now-playing">
                <div class="song-details">
                    <h4 id="track-name">Ready to play</h4>
                    <p id="track-artist">YouTube Playlist</p>
                </div>
            </div>
            
            <div class="player-controls">
                <div class="buttons">
                    <button onclick="prevVideo()"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="play-btn" onclick="togglePlay()"><i id="play-icon" class="fa-solid fa-play"></i></button>
                    <button onclick="nextVideo()"><i class="fa-solid fa-forward-step"></i></button>
                    <button onclick="toggleQueue()" class="list-btn"><i class="fa-solid fa-list"></i></button>
                </div>
                
                <div class="progress-bar-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="seek-bar" value="0" min="0" max="100" step="1">
                    <span id="total-time">0:00</span>
                </div>
            </div>
        </div>

        <div class="shortcuts">
            <span><kbd>Space</kbd> PLAY / PAUSE</span>
            <span><kbd>←</kbd> <kbd>→</kbd> SEEK</span>
            <span><kbd>N</kbd> NEXT</span>
            <span><kbd>P</kbd> PREV</span>
            <span><kbd>Q</kbd> QUEUE</span>
        </div>
    </footer>

    <!-- Creator Signature -->
    <div class="creator-signature">
        <a href="https://github.com/nileshk007-dev" target="_blank">Crafted by Nilesh Karma</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
